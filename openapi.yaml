openapi: 3.1.0
info:
    title: Bonyan-API
    version: 3.0.0
    summary: Multi-source fallback REST API for Islamic digital content.
    license:
        name: MIT
        identifier: MIT
    contact:
        name: BonyanOSS
        url: https://github.com/BonyanOSS/Bonyan-API
    description:
        Ordered, validated source adapters. Required fields are never null or placeholders. Missing optional metadata is omitted, never inferred.
        Reciter IDs retain MP3Quran identity; equivalent audio is matched by narrator, narration and style. See SOURCES.md for source scope and
        failover limits.
servers:
    - url: http://localhost:3000
      description: Local development
tags:
    - name: Meta
    - name: Surah
    - name: Ayat
    - name: Reciters
    - name: Tafsir
    - name: Azkar
    - name: Hadith
    - name: Prayer
    - name: Hijri
    - name: Qibla
paths:
    /:
        get:
            tags:
                - Meta
            summary: Route catalogue
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RouteCatalogue'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getRouteCatalogue
    /health:
        get:
            tags:
                - Meta
            summary: Liveness probe
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Health'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getHealth
    /ready:
        get:
            tags:
                - Meta
            summary: Readiness probe with cache stats
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ready'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getReadiness
    /metrics:
        get:
            tags:
                - Meta
            summary: Prometheus metrics
            responses:
                '200':
                    description: Prometheus metrics
                    content:
                        text/plain:
                            schema:
                                type: string
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getMetrics
    /surah:
        get:
            tags:
                - Surah
            summary: List all surahs
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SurahResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getSurah
    /surah/{id}:
        get:
            tags:
                - Surah
            summary: Get a surah by id
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 114
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SurahIdResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getSurahId
    /surah/search:
        get:
            tags:
                - Surah
            summary: Search surah by name
            parameters:
                - name: name
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SurahSearchResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getSurahSearch
    /ayat:
        get:
            tags:
                - Ayat
            summary: Get full Quran text
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AyatResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAyat
    /ayat/{id}:
        get:
            tags:
                - Ayat
            summary: Get aya by absolute number
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 6236
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AyatIdResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAyatId
    /ayat/{surah}/aya/{id}:
        get:
            tags:
                - Ayat
            summary: Get aya by surah and verse number
            parameters:
                - $ref: '#/components/parameters/SurahId'
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AyatSurahAyaIdResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAyatSurahAyaId
    /ayat/search:
        get:
            tags:
                - Ayat
            summary: Search Quran text
            parameters:
                - name: text
                  in: query
                  required: true
                  schema:
                      type: string
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 500
                      default: 50
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AyatSearchResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAyatSearch
    /reciters:
        get:
            tags:
                - Reciters
            summary: List reciters
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecitersResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getReciters
    /reciters/{id}:
        get:
            tags:
                - Reciters
            summary: Get reciter by id
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecitersIdResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getRecitersId
    /reciters/{id}/surah/{surah}:
        get:
            tags:
                - Reciters
            summary: Resolve audio URL
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
                - $ref: '#/components/parameters/SurahId'
                - name: moshaf
                  in: query
                  description:
                      Select a listed recording ID. Defaults to a covering Hafs murattal recording, then another covering recording. Fallback preserves the
                      selected narration and style.
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecitersIdSurahSurahResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getRecitersIdSurahSurah
    /reciters/search:
        get:
            tags:
                - Reciters
            summary: Search reciters by name
            parameters:
                - name: name
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecitersSearchResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getRecitersSearch
    /tafsir:
        get:
            tags:
                - Tafsir
            summary: List supported tafsir editions
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TafsirResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getTafsir
    /tafsir/{edition}/{surah}:
        get:
            tags:
                - Tafsir
            summary: Get tafsir for a surah
            parameters:
                - $ref: '#/components/parameters/Edition'
                - $ref: '#/components/parameters/SurahId'
                - name: aya
                  in: query
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TafsirEditionSurahResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getTafsirEditionSurah
    /tafsir/{edition}/{surah}/{aya}:
        get:
            tags:
                - Tafsir
            summary: Get tafsir for one aya
            parameters:
                - $ref: '#/components/parameters/Edition'
                - $ref: '#/components/parameters/SurahId'
                - name: aya
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TafsirEditionSurahAyaResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getTafsirEditionSurahAya
    /azkar:
        get:
            tags:
                - Azkar
            summary: List azkar categories
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AzkarResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAzkar
    /azkar/random:
        get:
            tags:
                - Azkar
            summary: Get random zekr
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AzkarRandomResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAzkarRandom
    /azkar/search:
        get:
            tags:
                - Azkar
            summary: Search azkar
            parameters:
                - name: text
                  in: query
                  required: true
                  schema:
                      type: string
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 50
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AzkarSearchResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAzkarSearch
    /azkar/{category}:
        get:
            tags:
                - Azkar
            summary: Get azkar category
            parameters:
                - name: category
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AzkarCategoryResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getAzkarCategory
            description:
                Canonical Hisn al-Muslim chapter title. Morning and evening adhkar share one chapter. Item IDs are ordinals within the returned chapter
                and dataset, not cross-source identities. Missing structured repeat counts are omitted.
    /hadith:
        get:
            tags:
                - Hadith
            summary: List hadith books
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HadithResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
            operationId: getHadith
    /hadith/random:
        get:
            tags:
                - Hadith
            summary: Get random hadith
            parameters:
                - name: book
                  in: query
                  schema:
                      type: string
                      enum:
                          - abu-daud
                          - ahmad
                          - bukhari
                          - darimi
                          - ibnu-majah
                          - malik
                          - muslim
                          - nasai
                          - tirmidzi
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HadithRandomResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHadithRandom
    /hadith/{book}:
        get:
            tags:
                - Hadith
            summary: Get hadith range from a book
            parameters:
                - name: book
                  in: path
                  required: true
                  schema:
                      type: string
                      enum:
                          - abu-daud
                          - ahmad
                          - bukhari
                          - darimi
                          - ibnu-majah
                          - malik
                          - muslim
                          - nasai
                          - tirmidzi
                - name: from
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                - name: to
                  in: query
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HadithBookResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHadithBook
            description:
                Range uses actual upstream hadith numbers, with at most 300 numbers inclusive. Numbering has gaps, so available is the number of stored
                hadiths rather than a maximum ID; a valid range can return an empty array.
    /hadith/{book}/{number}:
        get:
            tags:
                - Hadith
            summary: Get one hadith by number
            parameters:
                - name: book
                  in: path
                  required: true
                  schema:
                      type: string
                      enum:
                          - abu-daud
                          - ahmad
                          - bukhari
                          - darimi
                          - ibnu-majah
                          - malik
                          - muslim
                          - nasai
                          - tirmidzi
                - name: number
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HadithBookNumberResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHadithBookNumber
    /prayer/times:
        get:
            tags:
                - Prayer
            summary: Get prayer times
            parameters:
                - name: date
                  in: query
                  schema:
                      type: string
                      pattern: ^\d{2}-\d{2}-\d{4}$
                - name: latitude
                  in: query
                  schema:
                      type: number
                      minimum: -90
                      maximum: 90
                - name: longitude
                  in: query
                  schema:
                      type: number
                      minimum: -180
                      maximum: 180
                - name: city
                  in: query
                  schema:
                      type: string
                - name: country
                  in: query
                  schema:
                      type: string
                - name: method
                  in: query
                  schema:
                      type: integer
                      enum:
                          - 1
                          - 2
                          - 3
                          - 4
                          - 5
                          - 9
                          - 10
                          - 11
                      default: 4
                - name: timezone
                  in: query
                  description: IANA timezone applied to all sources. Coordinate requests support local fallback; city-only requests need the remote geocoder.
                  schema:
                      type: string
                      default: UTC
                      example: Asia/Riyadh
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PrayerTimesResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getPrayerTimes
    /hijri/today:
        get:
            tags:
                - Hijri
            summary: Get today's Hijri and Gregorian dates
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HijriTodayResponse'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHijriToday
            description:
                Both sources use Umm al-Qura. AlAdhan conversions are checked against local ICU results; the calendar field is islamic-umalqura.
                Calendar conversion does not determine local moon sightings.
    /hijri/from-gregorian:
        get:
            tags:
                - Hijri
            summary: Convert Gregorian date to Hijri
            parameters:
                - name: date
                  in: query
                  required: false
                  description: Defaults to the server current date.
                  schema:
                      type: string
                      pattern: ^\d{2}-\d{2}-\d{4}$
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HijriFromGregorianResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHijriFromGregorian
    /hijri/to-gregorian:
        get:
            tags:
                - Hijri
            summary: Convert Hijri date to Gregorian
            parameters:
                - $ref: '#/components/parameters/Date'
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HijriToGregorianResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getHijriToGregorian
    /qibla:
        get:
            tags:
                - Qibla
            summary: Get Qibla direction
            parameters:
                - name: latitude
                  in: query
                  required: true
                  schema:
                      type: number
                      minimum: -90
                      maximum: 90
                - name: longitude
                  in: query
                  required: true
                  schema:
                      type: number
                      minimum: -180
                      maximum: 180
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QiblaResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalError'
                '503':
                    $ref: '#/components/responses/Unavailable'
            operationId: getQibla
components:
    parameters:
        Date:
            name: date
            in: query
            required: true
            schema:
                type: string
                pattern: ^\d{2}-\d{2}-\d{4}$
        Edition:
            name: edition
            in: path
            required: true
            schema:
                type: string
                enum:
                    - muyassar
                    - saadi
        SurahId:
            name: surah
            in: path
            required: true
            schema:
                type: integer
                minimum: 1
                maximum: 114
