name: CI Check

on:
    schedule:
        - cron: '30 6 * * 1'
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: Lint, Build & Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit dependencies
              run: pnpm audit --audit-level low

            - name: Run ESLint
              run: pnpm lint:check

            - name: Run TypeScript build
              run: pnpm build

            - name: Validate Cloudflare Worker configuration
              run: pnpm cloudflare:check

            - name: Start Worker in the Cloudflare runtime
              timeout-minutes: 2
              run: pnpm cloudflare:startup

            - name: Build and smoke test the Node.js image
              timeout-minutes: 5
              run: |
                  docker build -t bonyan-api-ci .
                  docker run --detach --name bonyan-api-ci --publish 127.0.0.1:3000:3000 bonyan-api-ci
                  trap 'docker logs bonyan-api-ci; docker rm --force bonyan-api-ci' EXIT
                  curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 5 http://127.0.0.1:3000/health --output /tmp/bonyan-health.json
                  node -e "const fs = require('node:fs'); const assert = require('node:assert/strict'); assert.equal(JSON.parse(fs.readFileSync('/tmp/bonyan-health.json', 'utf8')).status, 'ok');"

            - name: Run Vitest tests with coverage
              run: pnpm test:coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: coverage
